<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mikbil: beli voucher WiFi mandiri dengan QRIS." />
    <title>Mikbil</title>
    <!-- Cegah flash tema: terapkan cache sebelum render. -->
    <script>
      try {
        var t = JSON.parse(localStorage.getItem("mikbil-theme") || "null");
        if (t) {
          var r = document.documentElement;
          if (t.theme_mode) r.setAttribute("data-theme", t.theme_mode);
          if (t.accent_color) r.style.setProperty("--accent", t.accent_color);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
