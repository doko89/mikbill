# Rilis Mikbil (kontrak rilis v1): push tag v* -> GitHub Release berisi
# mikbil_<ver>_linux_amd64.tar.gz, mikbil_<ver>_linux_arm64.tar.gz,
# mikbil_<ver>_windows_amd64.zip, dan checksums.txt (sha256 semua aset).
# Versi binary distempel dari tag via -X main.Version (main.go memakai var Version).
name: Rilis

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: rilis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Bangun frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/dist
          retention-days: 1

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: server/go.sum
      - name: Pasang dist segar (ganti bawaan checkout)
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/web/dist-fresh
      - name: Bangun binary
        working-directory: server
        run: |
          rm -rf web/dist
          mv web/dist-fresh web/dist
          BIN=mikbil
          if [ "$GOOS" = "windows" ]; then BIN=mikbil.exe; fi
          go build -trimpath -ldflags "-s -w -X main.Version=${GITHUB_REF_NAME}" -o "../out/$BIN" ./cmd/mikbil
      - name: Kemas aset rilis
        run: |
          VER="${GITHUB_REF_NAME#v}"
          STAGE="stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE" out
          if [ "$GOOS" = "windows" ]; then
            cp "out/mikbil.exe" "$STAGE/"
          else
            cp out/mikbil deploy/mikbil.service deploy/mikbil.env.contoh "$STAGE/"
          fi
          cat > "$STAGE/README.md" <<EOF
          # Mikbil $GITHUB_REF_NAME ($GOOS/$GOARCH)
          
          Billing hotspot voucher self-service + QRIS. Satu binary menyajikan
          backend API dan frontend (di-embed); SQLite satu-satunya state eksternal.
          
          ## Pasang cepat
          
          Linux:
          
          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/doko89/mikbill/main/deploy/install.sh | sudo bash
          \`\`\`
          
          Windows (PowerShell admin):
          
          \`\`\`powershell
          irm https://raw.githubusercontent.com/doko89/mikbill/main/deploy/install.ps1 | iex
          \`\`\`
          
          ## Manual
          
          1. \`./mikbil genkey\` sekali saja, simpan hasilnya aman.
          2. Isi env lalu jalan: \`MIKBIL_ENC_KEY=<genkey> MIKBIL_DB=./mikbil.db MIKBIL_ADDR=:8080 ./mikbil serve\`
          3. Buka \`http://localhost:8080/setup\` untuk wizard awal.
          
          Perintah lain: \`mikbil migrate\`, \`mikbil version\`.
          Verifikasi arsip: \`sha256sum -c\` dengan checksums.txt dari halaman rilis.
          EOF
          if [ "$GOOS" = "windows" ]; then
            (cd "$STAGE" && zip "../mikbil_${VER}_${GOOS}_${GOARCH}.zip" mikbil.exe README.md)
          else
            tar -czf "mikbil_${VER}_${GOOS}_${GOARCH}.tar.gz" -C "$STAGE" mikbil mikbil.service mikbil.env.contoh README.md
          fi
          ls -la mikbil_* | sed 's/^/aset: /'
      - uses: actions/upload-artifact@v4
        with:
          name: paket-${{ matrix.goos }}-${{ matrix.goarch }}
          path: mikbil_*
          retention-days: 1

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: paket-*
          path: aset
          merge-multiple: true
      - name: Buat rilis + checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd aset
          sha256sum mikbil_* > checksums.txt
          cat checksums.txt | sed 's/^/sha256: /'
          TAG="$GITHUB_REF_NAME"
          NOTES="Mikbil $TAG. Verifikasi unduhan dengan checksums.txt (sha256)."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber mikbil_* checksums.txt
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "$NOTES" mikbil_* checksums.txt
          fi
